<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário, Pai ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: #000;
    }

    body {
      cursor: pointer;
      user-select: none;
    }

    .slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .foto {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
      background: #000;
    }

    .degrade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05) 35%,
          rgba(0,0,0,0.18) 55%,
          rgba(0,0,0,0.78) 100%
        );
    }

    .frase {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 9vh;
      transform: translateX(-50%);
      width: min(850px, 88vw);
      text-align: center;
      color: white;
      font-size: clamp(1.3rem, 2.6vw, 2.2rem);
      line-height: 1.35;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      transition: opacity 1.1s ease-in-out, transform 1.1s ease-in-out;
    }

    .clique {
      position: absolute;
      z-index: 3;
      bottom: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.65);
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: opacity 0.5s;
    }

    .slideshow.saindo .foto,
    .slideshow.saindo .frase {
      opacity: 0;
    }

    .slideshow.saindo .frase {
      transform: translateX(-50%) translateY(10px);
    }

    .slideshow.saindo .clique {
      opacity: 0;
    }

    .final {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease-in-out;

      /* TROQUE AQUI PELO BACKGROUND QUE VOCÊ ESCOLHER */
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.10), transparent 55%),
        #111;
    }

    .final.ativo {
      opacity: 1;
      pointer-events: auto;
    }

    .final-conteudo {
      width: min(850px, 90vw);
      text-align: center;
      color: white;
    }

    .final-conteudo p {
      font-size: clamp(1.5rem, 3vw, 2.8rem);
      line-height: 1.45;
      text-shadow: 0 3px 15px rgba(0,0,0,0.8);
      animation: aparecer 2.5s ease forwards;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .frase {
        bottom: 10vh;
        width: 88vw;
      }

      .clique {
        bottom: 3vh;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="slideshow" class="slideshow" aria-label="Homenagem de aniversário">
      <img id="foto" class="foto" src="fotos/foto-01.jpeg" alt="Foto da homenagem">

      <div class="degrade"></div>

      <div id="frase" class="frase">Pai, obrigado por ser...</div>

      <div class="clique">Clique para continuar</div>
    </section>

    <section id="final" class="final">
      <div class="final-conteudo">
        <p id="texto-final">Feliz aniversário Pai, Eu Te Amo ❤️</p>
      </div>
    </section>
  </main>

  <script>
    const fotos = ['foto01.jpg', 'foto-02.jpeg', 'foto-03.jpeg', 'foto-04.jpeg', 'foto-05.jpeg', 'foto-06.jpeg', 'foto-07.jpeg', 'foto-08.jpeg', 'foto-09.jpeg', 'foto-10.jpeg', 'foto-11.jpeg', 'foto-12.jpeg', 'foto-13.jpeg', 'foto-14.jpeg', 'foto-15.jpeg', 'foto-16.jpeg', 'foto-17.jpeg', 'foto-18.jpeg', 'foto-19.jpeg', 'foto-20.jpeg', 'foto-21.jpeg', 'foto-22.jpeg', 'foto-23.jpeg', 'foto-24.jpeg', 'foto-25.jpeg', 'foto-26.jpeg', 'foto-27.jpeg', 'foto-28.jpeg', 'foto-29.jpeg', 'foto-30.jpeg', 'foto-31.jpeg', 'foto-32.jpeg', 'foto-33.jpeg', 'foto-34.jpeg', 'foto-35.jpeg', 'foto-36.jpeg', 'foto-37.jpeg', 'foto-38.jpeg', 'foto-39.jpeg', 'foto-40.jpeg', 'foto-41.jpeg', 'foto-42.jpeg', 'foto-43.jpeg', 'foto-44.jpeg'];

    const frases = ['Pai, obrigado por ser...', 'Forte', 'responsável', 'Habilidoso', 'Cuidadoso', 'Bonito', 'Inteligente', 'Respeitoso', 'Conselheiro', 'Líder', 'Engraçado', 'Protetor', 'Guerreiro', 'Imponente', 'Pilar', 'Dedicado', 'Companheiro', 'Ídolo', 'Referência', 'Corajoso', 'Elegante', 'Músico', 'Charmoso', 'Confiável', 'Estiloso', 'Amoroso', 'Invencível', 'Completo', 'Único', 'Presente', 'Invejável', 'Campeão', 'Resistente', 'Exemplar', 'Temido', 'Bem aventurado', 'Merecedor', 'Herói', 'gênio', 'Professor', 'Amigo...', 'Meu melhor amigo', 'Um Pai...', 'O melhor Pai'];

    let indice = 0;
    let trocando = false;

    const slideshow = document.getElementById("slideshow");
    const foto = document.getElementById("foto");
    const frase = document.getElementById("frase");
    const final = document.getElementById("final");

    // Guarda as imagens já pedidas para o navegador não descartá-las.
    const cache = {};

    // Carrega uma foto e devolve uma Promise que só resolve quando ela terminou de carregar.
    function carregar(i) {
      if (i >= fotos.length) return Promise.resolve();
      if (cache[i]) return cache[i];

      cache[i] = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve();
        img.onerror = () => {
          console.warn("Foto não encontrada: fotos/" + fotos[i]);
          resolve();
        };
        img.src = "fotos/" + fotos[i];
      });

      return cache[i];
    }

    // Deixa as próximas fotos carregando em segundo plano.
    function preCarregar(a, quantidade) {
      for (let i = a; i < a + quantidade && i < fotos.length; i++) {
        carregar(i);
      }
    }

    function atualizarConteudo() {
      foto.src = "fotos/" + fotos[indice];
      frase.textContent = frases[indice];
    }

    preCarregar(1, 3);

    slideshow.addEventListener("click", () => {
      if (trocando) return;

      trocando = true;
      slideshow.classList.add("saindo");

      setTimeout(async () => {
        indice++;

        // Depois da última foto, mostra a tela final.
        if (indice >= fotos.length) {
          slideshow.style.display = "none";
          final.classList.add("ativo");
          return;
        }

        // Espera a próxima foto terminar de carregar antes de mostrar.
        await carregar(indice);
        atualizarConteudo();
        preCarregar(indice + 1, 3);

        // Pequeno intervalo para garantir o efeito de entrada.
        requestAnimationFrame(() => {
          slideshow.classList.remove("saindo");

          setTimeout(() => {
            trocando = false;
          }, 700);
        });
      }, 700);
    });
  </script>
</body>
</html>
